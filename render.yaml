services:
  - type: web
    name: spa-manager-api
    runtime: node
    rootDir: be
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false

  - type: web
    name: spa-manager-web
    runtime: static
    rootDir: fe
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
